apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: skillforge-gateway:latest
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: skillforge
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

apiVersion: v1
kind: Namespace
metadata:
  name: skillforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillforge-config
  namespace: skillforge
data:
  DATABASE_URL: "postgresql://skillforge:skillforge@postgres:5432/skillforge"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CORE_SERVICE_URL: "http://core:8000"
  ANALYZER_SERVICE_URL: "http://analyzer:8000"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
---
# Fill in real values before applying, or create with:
#   kubectl create secret generic skillforge-secrets -n skillforge \
#     --from-literal=JWT_SECRET=<random-string> \
#     --from-literal=ANTHROPIC_API_KEY=<your-key> \
#     --from-literal=POSTGRES_PASSWORD=<db-password>
apiVersion: v1
kind: Secret
metadata:
  name: skillforge-secrets
  namespace: skillforge
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"

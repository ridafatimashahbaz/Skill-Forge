apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: skillforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: skillforge-auth:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: skillforge-config }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: skillforge-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: skillforge
spec:
  selector: { app: auth }
  ports: [{ port: 8000, targetPort: 8000 }]

# Render Blueprint — deploys SkillForge with a public URL.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: New -> Blueprint -> connect this repo.
#   3. Render reads this file and provisions everything below.
#   4. You'll be prompted for ANTHROPIC_API_KEY during setup — get one at
#      https://console.anthropic.com/
#   5. After deploy, the "frontend" service's URL is your public link.
#
# Notes:
#   - auth/core/analyzer/ai/chroma are private services (type: pserv) — only
#     reachable from other services in this project, not from the internet.
#     Render resolves them by name (e.g. http://auth:8000) the same way
#     Docker Compose does, so services/gateway/nginx.conf works unchanged.
#   - Free-tier private services and the free Postgres plan are enough for a
#     hackathon demo; they are not sized for real traffic.

databases:
  - name: skillforge-db
    plan: free
    databaseName: skillforge
    user: skillforge

services:
  - type: pserv
    name: auth
    runtime: docker
    dockerfilePath: services/auth/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: skillforge-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true

  - type: pserv
    name: core
    runtime: docker
    dockerfilePath: services/core/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: skillforge-db, property: connectionString }
      - key: JWT_SECRET
        fromService: { type: pserv, name: auth, envVarKey: JWT_SECRET }

  - type: pserv
    name: analyzer
    runtime: docker
    dockerfilePath: services/analyzer/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: skillforge-db, property: connectionString }
      - key: JWT_SECRET
        fromService: { type: pserv, name: auth, envVarKey: JWT_SECRET }

  - type: pserv
    name: chroma
    runtime: image
    image:
      url: docker.io/chromadb/chroma:0.5.5
    plan: free
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 1

  - type: pserv
    name: ai
    runtime: docker
    dockerfilePath: services/ai/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: JWT_SECRET
        fromService: { type: pserv, name: auth, envVarKey: JWT_SECRET }
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORE_SERVICE_URL
        value: http://core:8000
      - key: ANALYZER_SERVICE_URL
        value: http://analyzer:8000
      - key: CHROMA_HOST
        value: chroma
      - key: CHROMA_PORT
        value: "8000"

  - type: web
    name: gateway
    runtime: docker
    dockerfilePath: services/gateway/Dockerfile
    dockerContext: .
    plan: free

  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService: { type: web, name: gateway, property: url }

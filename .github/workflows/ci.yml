name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check all Python services
        run: |
          python -m py_compile services/common/*.py services/auth/main.py \
            services/core/main.py services/analyzer/*.py services/ai/*.py \
            scripts/seed_questions.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-syntax-check, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          docker build -f services/auth/Dockerfile -t skillforge-auth .
          docker build -f services/core/Dockerfile -t skillforge-core .
          docker build -f services/analyzer/Dockerfile -t skillforge-analyzer .
          docker build -f services/ai/Dockerfile -t skillforge-ai .
          docker build -f services/gateway/Dockerfile -t skillforge-gateway .
          docker build -t skillforge-frontend ./frontend
